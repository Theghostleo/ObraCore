<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ObraCore</title>

<!-- Única fuente externa permitida: Google Fonts (Space Grotesk para UI, IBM Plex Mono para datos/técnico) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="oc-app">

  <!-- ============================================================
       1. NAVBAR
       ============================================================ -->
  <header id="oc-navbar">
    <div id="oc-logo">Obra<span>Core</span></div>

    <!-- Los dos primeros ya tienen vista real (ver router en el script);
         los otros dos siguen sin pantalla, deshabilitados con tooltip. -->
    <ul id="oc-nav-sections">
      <li><button type="button" class="oc-active" data-nav="calendario" data-route="#/calendario" data-i18n="nav.calendario">Calendario</button></li>
      <li><button type="button" data-nav="flujo" data-route="#/flujo" data-i18n="nav.flujo">Flujo de trabajo</button></li>
      <li><button type="button" data-nav="tercero" data-i18n="nav.tercero" disabled>Tercero</button></li>
      <li><button type="button" data-nav="cuarto" data-i18n="nav.cuarto" disabled>Cuarto</button></li>
    </ul>

    <!-- Selector de idioma: la traducción real la maneja i18n.js -->
    <div id="oc-lang-switch" role="group" data-i18n-aria="lang.aria" aria-label="Idioma">
      <button type="button" class="oc-lang-btn oc-active" data-lang="es">ES</button>
      <button type="button" class="oc-lang-btn" data-lang="en">EN</button>
    </div>

    <!-- TEMPORAL: sin destino todavía. Sección de registro/cuenta de usuario. -->
    <a href="#" id="oc-user-link" data-i18n-aria="user.aria" aria-label="Registro">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
    </a>
  </header>

  <!-- ============================================================
       2. PANEL CENTRAL — calendario (agenda) y flujo de trabajo
       ============================================================ -->
  <main id="oc-main">
    <section id="oc-calendar-panel">
      <div id="oc-cal-header">
        <div id="oc-cal-title"></div>
        <div id="oc-cal-nav">
          <button type="button" class="oc-nav-btn" id="oc-cal-leyenda-btn" data-i18n-aria="leyenda.aria" aria-label="Leyenda" aria-haspopup="true" aria-expanded="false">?</button>
          <button type="button" class="oc-nav-btn" id="oc-cal-prev" data-i18n-aria="cal.prevAria" aria-label="Mes anterior">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <button type="button" class="oc-nav-btn" id="oc-cal-next" data-i18n-aria="cal.nextAria" aria-label="Mes siguiente">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
          </button>
        </div>
      </div>
      <div id="oc-cal-weekdays">
        <span data-i18n-list="cal.weekdays" data-i18n-index="0">L</span><span data-i18n-list="cal.weekdays" data-i18n-index="1">M</span><span data-i18n-list="cal.weekdays" data-i18n-index="2">M</span><span data-i18n-list="cal.weekdays" data-i18n-index="3">J</span><span data-i18n-list="cal.weekdays" data-i18n-index="4">V</span><span data-i18n-list="cal.weekdays" data-i18n-index="5">S</span><span data-i18n-list="cal.weekdays" data-i18n-index="6">D</span>
      </div>
      <div id="oc-cal-grid"></div>
    </section>

    <!-- ============================================================
         2b. PANEL CENTRAL — flujo de trabajo (vista general + detalle
         por proyecto). Oculto por defecto; el router en el script
         alterna este panel con #oc-calendar-panel según el hash.
         ============================================================ -->
    <section id="oc-flujo-panel" hidden></section>
  </main>

</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="i18n.js?v=3"></script>
<script src="store.js"></script>
<script src="pdfStore.js"></script>
<script src="pdf.js"></script>
<script src="flujo.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     CONSTANTES COMPARTIDAS
     ============================================================ */
  var ESTADOS_PROYECTO_MANUALES = ['pausado', 'perdido', 'cancelado'];

  function abrirProyecto(proyectoId) {
    location.hash = '#/flujo/' + proyectoId;
  }

  /* ============================================================
     MENÚ MANUAL DEL PROYECTO — botón "⋯" de la vista de Flujo (fila y
     detalle). Si el proyecto no está en un estado manual: Pausar /
     Marcar como perdido / Cancelar. Si ya está en uno: solo
     Reactivar (OCStore.reactivarProyecto, que recalcula de verdad).
     ============================================================ */
  var proyectoMenuDropdownEl = null;

  function closeProyectoMenuDropdown() {
    if (proyectoMenuDropdownEl && proyectoMenuDropdownEl.parentNode) {
      proyectoMenuDropdownEl.parentNode.removeChild(proyectoMenuDropdownEl);
    }
    proyectoMenuDropdownEl = null;
    document.removeEventListener('click', onDocumentClickForProyectoMenu, true);
  }

  function onDocumentClickForProyectoMenu(e) {
    if (proyectoMenuDropdownEl && !proyectoMenuDropdownEl.contains(e.target)) {
      closeProyectoMenuDropdown();
    }
  }

  function openProyectoMenuDropdown(anchorRect, proyectoId) {
    closeProyectoMenuDropdown();
    var proyecto = OCStore.getProyecto(proyectoId);
    var esManual = !!proyecto && ESTADOS_PROYECTO_MANUALES.indexOf(proyecto.estado) !== -1;

    var el = document.createElement('div');
    el.className = 'oc-cotizacion-dropdown';

    function addOpcion(labelKey, onClick) {
      var fila = document.createElement('div');
      fila.className = 'oc-dropdown-item';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'oc-dropdown-btn';
      btn.textContent = OC_I18N.t(labelKey);
      btn.addEventListener('click', function () {
        closeProyectoMenuDropdown();
        onClick();
      });
      fila.appendChild(btn);
      el.appendChild(fila);
    }

    if (esManual) {
      addOpcion('proyecto.menu.reactivar', function () { OCStore.reactivarProyecto(proyectoId); });
    } else {
      addOpcion('proyecto.menu.pausar', function () { OCStore.actualizarProyecto(proyectoId, { estado: 'pausado' }); });
      addOpcion('proyecto.menu.marcarPerdido', function () { OCStore.actualizarProyecto(proyectoId, { estado: 'perdido' }); });
      addOpcion('proyecto.menu.cancelar', function () { OCStore.actualizarProyecto(proyectoId, { estado: 'cancelado' }); });
    }

    document.body.appendChild(el);
    proyectoMenuDropdownEl = el;

    var elRect = el.getBoundingClientRect();
    var left = Math.min(anchorRect.left, window.innerWidth - elRect.width - 12);
    var top = Math.min(anchorRect.bottom + 6, window.innerHeight - elRect.height - 12);
    left = Math.max(12, left);
    top = Math.max(12, top);
    el.style.left = left + 'px';
    el.style.top = top + 'px';

    setTimeout(function () {
      document.addEventListener('click', onDocumentClickForProyectoMenu, true);
    }, 0);
  }

  // Sugerencia discreta (nunca automática) de marcar el proyecto como
  // perdido: se dispara desde el aviso "⚠" de Flujo o justo después de
  // registrar el rechazo que deja todas sus cotizaciones rechazadas.
  function mostrarSugerenciaPerdido(proyectoId) {
    var overlay = document.createElement('div');
    overlay.className = 'oc-modal-overlay';
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        cerrarModalGenerico(overlay);
      }
    });

    var modal = document.createElement('div');
    modal.className = 'oc-modal';

    var titulo = document.createElement('h3');
    titulo.textContent = OC_I18N.t('proyecto.sugerenciaPerdido.titulo');
    modal.appendChild(titulo);

    var texto = document.createElement('p');
    texto.textContent = OC_I18N.t('proyecto.sugerenciaPerdido.texto');
    modal.appendChild(texto);

    var acciones = document.createElement('div');
    acciones.className = 'oc-modal-actions';

    var btnNoAhora = document.createElement('button');
    btnNoAhora.type = 'button';
    btnNoAhora.className = 'oc-btn oc-btn-secondary';
    btnNoAhora.textContent = OC_I18N.t('proyecto.sugerenciaPerdido.noAhora');
    btnNoAhora.addEventListener('click', function () { cerrarModalGenerico(overlay); });
    acciones.appendChild(btnNoAhora);

    var btnMarcar = document.createElement('button');
    btnMarcar.type = 'button';
    btnMarcar.className = 'oc-btn oc-btn-primary';
    btnMarcar.textContent = OC_I18N.t('proyecto.menu.marcarPerdido');
    btnMarcar.addEventListener('click', function () {
      OCStore.actualizarProyecto(proyectoId, { estado: 'perdido' });
      cerrarModalGenerico(overlay);
    });
    acciones.appendChild(btnMarcar);

    modal.appendChild(acciones);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  /* ============================================================
     NAVBAR — Calendario y Flujo de trabajo navegan por hash (ver
     router más abajo); los otros dos siguen deshabilitados.
     ============================================================ */
  function initNavbar() {
    document.querySelectorAll('#oc-nav-sections button[data-route]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        location.hash = btn.getAttribute('data-route');
      });
    });
    document.querySelectorAll('#oc-nav-sections button[disabled]').forEach(function (btn) {
      btn.title = OC_I18N.t('stage.proximamente');
    });
    document.addEventListener('oc:langchange', function () {
      document.querySelectorAll('#oc-nav-sections button[disabled]').forEach(function (btn) {
        btn.title = OC_I18N.t('stage.proximamente');
      });
    });
    // El selector ES/EN lo maneja OC_I18N (ver i18n.js)
  }

  /* ============================================================
     ROUTER — #/calendario (por defecto) · #/flujo · #/flujo/PRJ-XXXX.
     Único punto que decide qué panel central se muestra; renderAll()
     llama a aplicarRuta() en vez de renderCalendar() directo para que
     tanto 'oc:dataChange' como 'oc:langchange' queden conscientes de
     la vista activa sin duplicar ese enganche.
     ============================================================ */
  function parseRoute() {
    var hash = location.hash || '#/calendario';
    var m = hash.match(/^#\/flujo\/(PRJ-\d+)$/);
    if (m) {
      return { vista: 'flujo', proyectoId: m[1] };
    }
    if (hash === '#/flujo') {
      return { vista: 'flujo', proyectoId: null };
    }
    return { vista: 'calendario', proyectoId: null };
  }

  function actualizarBotonesNavActivos(vista) {
    document.querySelectorAll('#oc-nav-sections button[data-route]').forEach(function (btn) {
      btn.classList.toggle('oc-active', btn.getAttribute('data-nav') === vista);
    });
  }

  function animarEntradaVista(panel) {
    panel.classList.remove('oc-vista-entrando');
    // Forzar reflow para poder reiniciar la animación si se vuelve a
    // entrar a la misma vista (ej. cambiar de proyecto en Flujo).
    void panel.offsetWidth;
    panel.classList.add('oc-vista-entrando');
  }

  function aplicarRuta() {
    var ruta = parseRoute();
    var panelCal = document.getElementById('oc-calendar-panel');
    var panelFlujo = document.getElementById('oc-flujo-panel');
    panelCal.hidden = ruta.vista !== 'calendario';
    panelFlujo.hidden = ruta.vista !== 'flujo';
    actualizarBotonesNavActivos(ruta.vista);
    if (ruta.vista === 'calendario') {
      animarEntradaVista(panelCal);
      renderCalendar();
    } else {
      animarEntradaVista(panelFlujo);
      if (window.OCFlujo) {
        OCFlujo.render(panelFlujo, ruta);
      }
    }
  }

  function initRouter() {
    if (!location.hash) {
      history.replaceState(null, '', '#/calendario');
    }
    window.addEventListener('hashchange', aplicarRuta);
  }

  /* ============================================================
     ETAPA 1 "SOLICITUD DE COTIZACIÓN" — la relación proyecto<->
     solicitud es 1:1, así que no hace falta un selector: si el
     proyecto no tiene solicitud todavía abre una en blanco, si ya
     tiene, abre esa.
     ============================================================ */
  function openSolicitudFlow(proyectoId) {
    var sol = OCStore.getSolicitudPorProyecto(proyectoId);
    if (sol) {
      window.location.href = 'OC_SOLICITUD.html?proyecto=' + encodeURIComponent(proyectoId) + '&id=' + encodeURIComponent(sol.id) + '&desde=flujo';
    } else {
      window.location.href = 'OC_SOLICITUD.html?proyecto=' + encodeURIComponent(proyectoId) + '&desde=flujo';
    }
  }

  /* ============================================================
     ETAPA "COTIZACIÓN" — desplegable anclado al nodo/celda de Cotización
     de la vista de Flujo (no
     navega directo). Ofrece hasta 3 opciones según el día:
     "Cotizar" (siempre), "Ir a cotización" (si hay exactamente 1
     cotización vigente) y "Ver lista de cotizaciones" (si hay 2+).
     ============================================================ */
  function formatoMonedaSimple(valor, moneda) {
    return window.OCPdf ? OCPdf.formatoMoneda(valor, moneda) : ('$ ' + (valor || 0).toFixed(2));
  }

  function estadoSolicitudActiva(sol) {
    return sol.estado !== 'rechazada' && sol.estado !== 'cancelada';
  }

  function abrirCotizacionDesdeItem(cot) {
    if (cot.estado === 'borrador') {
      window.location.href = 'OC_COTIZACION.html?id=' + encodeURIComponent(cot.id) + '&desde=flujo';
    } else {
      OCPdfStore.abrirPdf(cot.pdfKey);
    }
  }

  var cotizacionDropdownEl = null;

  function closeCotizacionDropdown() {
    if (cotizacionDropdownEl && cotizacionDropdownEl.parentNode) {
      cotizacionDropdownEl.parentNode.removeChild(cotizacionDropdownEl);
    }
    cotizacionDropdownEl = null;
    document.removeEventListener('click', onDocumentClickForCotizacionDropdown, true);
    document.removeEventListener('keydown', onKeydownForCotizacionDropdown, true);
  }

  function onDocumentClickForCotizacionDropdown(e) {
    if (cotizacionDropdownEl && !cotizacionDropdownEl.contains(e.target)) {
      closeCotizacionDropdown();
    }
  }

  function onKeydownForCotizacionDropdown(e) {
    if (e.key === 'Escape') {
      closeCotizacionDropdown();
    }
  }

  function openCotizacionDropdown(anchorRect, proyectoId) {
    closeCotizacionDropdown();

    var sol = OCStore.getSolicitudPorProyecto(proyectoId);
    var solActiva = sol && estadoSolicitudActiva(sol) ? sol : null;
    var cotizacionesProyecto = OCStore.getCotizacionesPorProyecto(proyectoId);
    var vigentes = cotizacionesProyecto.filter(function (c) { return c.estado !== 'sustituida'; });

    var el = document.createElement('div');
    el.className = 'oc-cotizacion-dropdown';

    // ---- "Cotizar" ----
    var filaCotizar = document.createElement('div');
    filaCotizar.className = 'oc-dropdown-item';

    if (!solActiva) {
      filaCotizar.classList.add('oc-dropdown-item-disabled');
      var aviso = document.createElement('span');
      aviso.textContent = OC_I18N.t('cotizacion.dropdown.sinSolicitud');
      var link = document.createElement('a');
      link.href = '#';
      link.className = 'oc-dropdown-link';
      link.textContent = OC_I18N.t('cotizacion.dropdown.irEtapa1');
      link.addEventListener('click', function (e) {
        e.preventDefault();
        closeCotizacionDropdown();
        openSolicitudFlow(proyectoId);
      });
      filaCotizar.appendChild(aviso);
      filaCotizar.appendChild(link);
    } else {
      var btnCotizar = document.createElement('button');
      btnCotizar.type = 'button';
      btnCotizar.className = 'oc-dropdown-btn';
      btnCotizar.textContent = OC_I18N.t('cotizacion.dropdown.cotizar');
      btnCotizar.addEventListener('click', function () {
        window.location.href = 'OC_COTIZACION.html?proyecto=' + encodeURIComponent(proyectoId) + '&solicitud=' + encodeURIComponent(solActiva.id) + '&desde=flujo';
      });
      filaCotizar.appendChild(btnCotizar);
    }
    el.appendChild(filaCotizar);

    // ---- "Ir a cotización" ----
    if (vigentes.length === 1) {
      var cotUnica = vigentes[0];
      var filaIr = document.createElement('div');
      filaIr.className = 'oc-dropdown-item';
      var btnIr = document.createElement('button');
      btnIr.type = 'button';
      btnIr.className = 'oc-dropdown-btn';
      btnIr.textContent = OC_I18N.t('cotizacion.dropdown.irACotizacion');
      btnIr.addEventListener('click', function () {
        closeCotizacionDropdown();
        abrirCotizacionDesdeItem(cotUnica);
      });
      filaIr.appendChild(btnIr);
      el.appendChild(filaIr);
    }

    // ---- "Ver lista de cotizaciones (n)" ----
    if (cotizacionesProyecto.length > 1) {
      var filaLista = document.createElement('div');
      filaLista.className = 'oc-dropdown-item';
      var btnLista = document.createElement('button');
      btnLista.type = 'button';
      btnLista.className = 'oc-dropdown-btn';
      btnLista.textContent = OC_I18N.t('cotizacion.dropdown.verLista') + ' (' + cotizacionesProyecto.length + ')';
      btnLista.addEventListener('click', function () {
        closeCotizacionDropdown();
        openCotizacionesListPanel(cotizacionesProyecto);
      });
      filaLista.appendChild(btnLista);
      el.appendChild(filaLista);
    }

    document.body.appendChild(el);
    cotizacionDropdownEl = el;

    var elRect = el.getBoundingClientRect();
    var left = Math.min(anchorRect.left, window.innerWidth - elRect.width - 12);
    var top = Math.min(anchorRect.bottom + 6, window.innerHeight - elRect.height - 12);
    left = Math.max(12, left);
    top = Math.max(12, top);
    el.style.left = left + 'px';
    el.style.top = top + 'px';

    setTimeout(function () {
      document.addEventListener('click', onDocumentClickForCotizacionDropdown, true);
      document.addEventListener('keydown', onKeydownForCotizacionDropdown, true);
    }, 0);
  }

  /* ============================================================
     "VER LISTA DE COTIZACIONES" — panel dentro de OC_MAIN con folio,
     versión, tipo, cliente, total, estado y fecha de emisión, más
     acciones por fila. Las sustituidas se muestran atenuadas y
     agrupadas bajo su versión vigente cuando se puede reconstruir
     la cadena (basadaEn).
     ============================================================ */
  var cotizacionesListPanelEl = null;

  function closeCotizacionesListPanel() {
    if (cotizacionesListPanelEl && cotizacionesListPanelEl.parentNode) {
      cotizacionesListPanelEl.parentNode.removeChild(cotizacionesListPanelEl);
    }
    cotizacionesListPanelEl = null;
  }

  // El id (COT-0001, COT-0002...) es un consecutivo asignado al crear,
  // así que ordena por creación de forma exacta — a diferencia de
  // creadaEn, que en la semilla puede empatar al milisegundo entre
  // varias cotizaciones creadas en la misma ráfaga síncrona.
  function idNumCot(id) {
    return parseInt(id.replace(/[^0-9]/g, ''), 10) || 0;
  }

  function ordenarCotizacionesParaLista(lista) {
    var porId = {};
    lista.forEach(function (c) { porId[c.id] = c; });
    function raizDe(c) {
      var actual = c;
      while (actual.tipo === 'actualizacion' && actual.basadaEn && porId[actual.basadaEn]) {
        actual = porId[actual.basadaEn];
      }
      return actual.id;
    }
    var grupos = {};
    var minIdNum = {};
    var ordenGrupos = [];
    lista.forEach(function (c) {
      var raiz = raizDe(c);
      var n = idNumCot(c.id);
      if (!grupos[raiz]) {
        grupos[raiz] = [];
        minIdNum[raiz] = n;
        ordenGrupos.push(raiz);
      } else if (n < minIdNum[raiz]) {
        minIdNum[raiz] = n;
      }
      grupos[raiz].push(c);
    });
    // Los grupos se muestran en el orden en que se creó su miembro más
    // antiguo — más fácil de leer que el orden "más reciente primero"
    // de la lista original, que dejaría una adicional nueva antes que
    // la familia original+versión de la que en realidad partió.
    ordenGrupos.sort(function (raizA, raizB) { return minIdNum[raizA] - minIdNum[raizB]; });
    var out = [];
    ordenGrupos.forEach(function (raiz) {
      grupos[raiz].sort(function (a, b) { return a.version - b.version; });
      out = out.concat(grupos[raiz]);
    });
    return out;
  }

  // Modal "registrar respuesta" (aceptar/rechazar), usado desde los
  // iconos ✓/✗ de la lista de cotizaciones. El PDF ya emitido nunca se
  // toca; onDone corre después de un registro exitoso (para refrescar
  // o cerrar el panel que lo abrió).
  function abrirModalRespuestaCotizacion(cot, tipo, onDone) {
    var overlay = document.createElement('div');
    overlay.className = 'oc-modal-overlay';
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        cerrarModalGenerico(overlay);
      }
    });

    var modal = document.createElement('div');
    modal.className = 'oc-modal';

    var titulo = document.createElement('h3');
    titulo.textContent = tipo === 'aceptada' ? OC_I18N.t('cotizacion.respuesta.tituloAceptar') : OC_I18N.t('cotizacion.respuesta.tituloRechazar');
    modal.appendChild(titulo);

    function campo(labelKey, tipoInput) {
      var field = document.createElement('div');
      field.className = 'oc-field';
      var label = document.createElement('label');
      label.textContent = OC_I18N.t(labelKey);
      var input = document.createElement('input');
      input.type = tipoInput || 'text';
      input.className = 'oc-input';
      field.appendChild(label);
      field.appendChild(input);
      modal.appendChild(field);
      return input;
    }

    var inputFecha = campo('cotizacion.campo.fecha', 'date');
    inputFecha.value = OCStore.todayISO();

    var selectMotivo = null;
    if (tipo === 'rechazada') {
      var fieldMotivo = document.createElement('div');
      fieldMotivo.className = 'oc-field';
      var labelMotivo = document.createElement('label');
      labelMotivo.textContent = OC_I18N.t('cotizacion.respuesta.campo.motivo');
      selectMotivo = document.createElement('select');
      selectMotivo.className = 'oc-input';
      OCStore.MOTIVOS_RECHAZO_COTIZACION.forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m;
        opt.textContent = OC_I18N.t('cotizacion.respuesta.motivo.' + (m === 'sin-respuesta' ? 'sinRespuesta' : m));

  /* ============================================================
     CALENDARIO — mes real del sistema, navegable
     ============================================================ */
  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth(); // 0-11

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  }

  var DAY_CHIPS_VISIBLE = 2;
  var DAY_TAREAS_VISIBLE = 2;

  /* ============================================================
     ACCIONES DE UN CLIC SOBRE UN EVENTO — el mismo arreglo
     {estado destino, clave i18n} lo consumen tanto el desplegable que
     abre un clic en un chip del calendario como las filas del modal
     "Eventos de este día". Los hitos solo ganan "Marcar hecho".
     ============================================================ */
  function accionesDisponiblesEvento(evt) {
    if (OCStore.claseDeEvento(evt.tipo) === 'hito') {
      return evt.estado === 'pendiente' ? [{ estado: 'hecho', labelKey: 'evento.accion.marcarHecho' }] : [];
    }
    if (evt.estado === 'tentativa') {
      return [
        { estado: 'confirmada', labelKey: 'evento.accion.confirmar' },
        { estado: 'cancelada', labelKey: 'evento.accion.cancelar' }
      ];
    }
    if (evt.estado === 'confirmada') {
      return [
        { estado: 'en_ejecucion', labelKey: 'evento.accion.iniciar' },
        { estado: 'cancelada', labelKey: 'evento.accion.cancelar' }
      ];
    }
    if (evt.estado === 'en_ejecucion') {
      return [
        { estado: 'terminada', labelKey: 'evento.accion.terminar' },
        { estado: 'cancelada', labelKey: 'evento.accion.cancelar' }
      ];
    }
    return []; // terminada/cancelada/hecho: nada que accionar
  }

  var eventoAccionesDropdownEl = null;

  function closeEventoAccionesDropdown() {
    if (eventoAccionesDropdownEl && eventoAccionesDropdownEl.parentNode) {
      eventoAccionesDropdownEl.parentNode.removeChild(eventoAccionesDropdownEl);
    }
    eventoAccionesDropdownEl = null;
    document.removeEventListener('click', onDocumentClickForEventoAcciones, true);
  }

  function onDocumentClickForEventoAcciones(e) {
    if (eventoAccionesDropdownEl && !eventoAccionesDropdownEl.contains(e.target)) {
      closeEventoAccionesDropdown();
    }
  }

  function openEventoAccionesDropdown(anchorRect, evt) {
    closeEventoAccionesDropdown();

    var el = document.createElement('div');
    el.className = 'oc-cotizacion-dropdown';

    accionesDisponiblesEvento(evt).forEach(function (accion) {
      var fila = document.createElement('div');
      fila.className = 'oc-dropdown-item';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'oc-dropdown-btn';
      btn.textContent = OC_I18N.t(accion.labelKey);
      btn.addEventListener('click', function () {
        OCStore.actualizarEvento(evt.id, { estado: accion.estado });
        closeEventoAccionesDropdown();
      });
      fila.appendChild(btn);
      el.appendChild(fila);
    });

    var filaVer = document.createElement('div');
    filaVer.className = 'oc-dropdown-item';
    var btnVer = document.createElement('button');
    btnVer.type = 'button';
    btnVer.className = 'oc-dropdown-btn';
    btnVer.textContent = OC_I18N.t('calendar.chip.abrirProyecto');
    btnVer.addEventListener('click', function (e) {
      e.stopPropagation();
      closeEventoAccionesDropdown();
      abrirProyecto(evt.proyectoId);
    });
    filaVer.appendChild(btnVer);
    el.appendChild(filaVer);

    document.body.appendChild(el);
    eventoAccionesDropdownEl = el;

    var elRect = el.getBoundingClientRect();
    var left = Math.min(anchorRect.left, window.innerWidth - elRect.width - 12);
    var top = Math.min(anchorRect.bottom + 6, window.innerHeight - elRect.height - 12);
    left = Math.max(12, left);
    top = Math.max(12, top);
    el.style.left = left + 'px';
    el.style.top = top + 'px';

    setTimeout(function () {
      document.addEventListener('click', onDocumentClickForEventoAcciones, true);
    }, 0);
  }

  // Construye un chip de evento: el color viene de la clase+estado (no
  // del tipo), agrega "· día n/m" si es una actividad multi-día que
  // toca este fechaISO, y el rojo de "vencida" se superpone encima del
  // color normal cuando aplica.
  function buildEventChip(evt, fechaISO) {
    var clase = OCStore.claseDeEvento(evt.tipo);
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'oc-evt-chip oc-evt-chip--' + (clase === 'hito' ? 'hito' : evt.estado);
    if (OCStore.eventoVencido(evt)) {
      chip.classList.add('oc-evt-chip--vencida');
    }
    var texto = OC_I18N.t('evento.tipo.' + evt.tipo) + ' · ' + evt.proyectoId;
    var diaInfo = OCStore.diaDeActividad(evt, fechaISO);
    if (diaInfo) {
      texto += ' · ' + OC_I18N.t('calendar.chip.dia') + ' ' + diaInfo.dia + '/' + diaInfo.total;
    }
    chip.textContent = texto;
    chip.addEventListener('click', function (e2) {
      e2.stopPropagation();
      openEventoAccionesDropdown(chip.getBoundingClientRect(), evt);
    });
    return chip;
  }

  /* ============================================================
     MENÚ DEL DÍA — clic izquierdo en cualquier día del mes. Orden:
     "Ver eventos del día (n)" (solo si hay), Nuevo proyecto, Agendar
     evento, y una sección "Tareas" con los recordatorios del día.
     Se cierra con Esc, clic afuera o con otro clic en el mismo día.
     ============================================================ */
  var dayMenuEl = null;
  var dayMenuFecha = null;

  function closeDayMenu() {
    if (dayMenuEl && dayMenuEl.parentNode) {
      dayMenuEl.parentNode.removeChild(dayMenuEl);
    }
    dayMenuEl = null;
    dayMenuFecha = null;
    document.removeEventListener('click', onDocumentClickForDayMenu, true);
    document.removeEventListener('keydown', onKeydownForDayMenu, true);
  }

  function onDocumentClickForDayMenu(e) {
    if (!dayMenuEl || dayMenuEl.contains(e.target)) {
      return;
    }
    // Clic en el mismo día (celda o chip de tarea): lo resuelve la propia
    // celda como toggle; cerrar aquí lo reabriría enseguida.
    var celda = e.target.closest ? e.target.closest('.oc-day-cell') : null;
    if (celda && celda.getAttribute('data-fecha') === dayMenuFecha && !e.target.closest('.oc-evt-chip')) {
      return;
    }
    closeDayMenu();
  }

  function onKeydownForDayMenu(e) {
    if (e.key === 'Escape') {
      closeDayMenu();
    }
  }

  // Tras mutar una tarea, persist() despacha 'oc:dataChange' en una
  // microtarea y el calendario se redibuja (cerrando el menú). Reabrir en
  // otra microtarea encolada DESPUÉS, sobre la celda nueva, lo mantiene abierto.
  function reabrirMenuDiaTrasRender(fechaISO) {
    Promise.resolve().then(function () {
      var cellEl = document.querySelector('.oc-day-cell[data-fecha="' + fechaISO + '"]');
      if (cellEl) {
        openDayMenu(cellEl, fechaISO, true);
      }
    });
  }

  function buildDayMenuBtn(texto, onClick, disabled) {
    var fila = document.createElement('div');
    fila.className = 'oc-dropdown-item';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'oc-dropdown-btn';
    btn.textContent = texto;
    btn.disabled = !!disabled;
    btn.addEventListener('click', onClick);
    fila.appendChild(btn);
    return fila;
  }

  function buildTareaRow(rec, fechaISO) {
    var row = document.createElement('div');
    row.className = 'oc-tarea-row' + (rec.hecho ? ' oc-tarea-row--hecho' : '');

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'oc-tarea-check';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', rec.hecho ? 'true' : 'false');
    check.setAttribute('aria-label', OC_I18N.t('tarea.marcarHecha'));
    check.addEventListener('click', function (e) {
      e.stopPropagation();
      OCStore.actualizarRecordatorio(rec.id, { hecho: !rec.hecho });
      reabrirMenuDiaTrasRender(fechaISO);
    });
    row.appendChild(check);

    var texto = document.createElement('button');
    texto.type = 'button';
    texto.className = 'oc-tarea-texto';
    texto.title = rec.nota || rec.titulo;
    if (rec.hora) {
      var hora = document.createElement('span');
      hora.className = 'oc-tarea-hora';
      hora.textContent = rec.hora;
      texto.appendChild(hora);
    }
    texto.appendChild(document.createTextNode(rec.titulo));
    texto.addEventListener('click', function (e) {
      e.stopPropagation();
      closeDayMenu();
      openTareaModal(fechaISO, rec);
    });
    row.appendChild(texto);

    // Borrado en dos pasos: 1er clic arma ("¿Eliminar?"), 2º elimina;
    // si el cursor sale de la fila se desarma.
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'oc-tarea-del';
    del.textContent = '✕';
    del.setAttribute('aria-label', OC_I18N.t('tarea.eliminarAria'));
    var armado = false;
    function desarmar() {
      armado = false;
      del.classList.remove('oc-tarea-del--armado');
      del.textContent = '✕';
    }
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!armado) {
        armado = true;
        del.classList.add('oc-tarea-del--armado');
        del.textContent = OC_I18N.t('tarea.eliminarConfirmar');
        return;
      }
      OCStore.eliminarRecordatorio(rec.id);
      reabrirMenuDiaTrasRender(fechaISO);
    });
    row.addEventListener('mouseleave', desarmar);
    row.appendChild(del);

    return row;
  }

  // sinAnimar: reapertura tras marcar/eliminar una tarea; evita repetir la entrada.
  function openDayMenu(cellEl, fechaISO, sinAnimar) {
    closeDayMenu();

    var eventosDia = OCStore.getEventosPorFecha(fechaISO).filter(function (e) { return e.estado !== 'cancelada'; });
    var tareas = OCStore.getRecordatoriosPorFecha(fechaISO);

    var el = document.createElement('div');
    el.className = 'oc-cotizacion-dropdown oc-day-menu' + (sinAnimar ? ' oc-sin-anim' : '');

    if (eventosDia.length > 0) {
      el.appendChild(buildDayMenuBtn(OC_I18N.t('calendar.diaMenu.verEventos') + ' (' + eventosDia.length + ')', function () {
        closeDayMenu();
        openDayEventsModal(fechaISO, eventosDia);
      }));
    }
    el.appendChild(buildDayMenuBtn(OC_I18N.t('calendar.diaVacio.nuevoProyecto'), function () {
      closeDayMenu();
      openNuevoProyectoModal(fechaISO);
    }));
    el.appendChild(buildDayMenuBtn(OC_I18N.t('calendar.diaVacio.agendarEvento'), function () {
      closeDayMenu();
      openNuevoEventoModal(fechaISO);
    }, OCStore.getProyectos().length === 0));

    var seccion = document.createElement('div');
    seccion.className = 'oc-dropdown-submenu oc-tareas-seccion';
    var tituloSec = document.createElement('div');
    tituloSec.className = 'oc-dropdown-submenu-title';
    tituloSec.textContent = OC_I18N.t('tarea.seccion');
    seccion.appendChild(tituloSec);
    tareas.forEach(function (rec) {
      seccion.appendChild(buildTareaRow(rec, fechaISO));
    });
    seccion.appendChild(buildDayMenuBtn(OC_I18N.t('tarea.nueva.boton'), function () {
      closeDayMenu();
      openTareaModal(fechaISO, null);
    }));
    el.appendChild(seccion);

    document.body.appendChild(el);
    dayMenuEl = el;
    dayMenuFecha = fechaISO;

    // Debajo de la celda; si no cabe, hacia arriba.
    var rect = cellEl.getBoundingClientRect();
    var elRect = el.getBoundingClientRect();
    var left = Math.max(12, Math.min(rect.left, window.innerWidth - elRect.width - 12));
    var top = rect.bottom + 6;
    if (top + elRect.height > window.innerHeight - 12) {
      top = rect.top - elRect.height - 6;
    }
    top = Math.max(12, top);
    el.style.left = left + 'px';
    el.style.top = top + 'px';

    document.addEventListener('click', onDocumentClickForDayMenu, true);
    document.addEventListener('keydown', onKeydownForDayMenu, true);
  }

  /* ============================================================
     MODAL "NUEVA TAREA / EDITAR TAREA" — recordatorio simple de un día:
     título (obligatorio), hora y nota opcionales. No se liga a proyectos.
     ============================================================ */
  function openTareaModal(fechaISO, rec) {
    var overlay = document.createElement('div');
    overlay.className = 'oc-modal-overlay';
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        cerrarModalGenerico(overlay);
      }
    });

    var modal = document.createElement('div');
    modal.className = 'oc-modal oc-modal-tarea';

    var titulo = document.createElement('h3');
    titulo.textContent = OC_I18N.t(rec ? 'tarea.modal.editar' : 'tarea.modal.nueva') + ' — ' + fechaISO;
    modal.appendChild(titulo);

    function campo(labelKey, tipo, valor) {
      var field = document.createElement('div');
      field.className = 'oc-field';
      var label = document.createElement('label');
      label.textContent = OC_I18N.t(labelKey);
      var input = document.createElement('input');
      input.type = tipo || 'text';
      input.className = 'oc-input';
      input.value = valor || '';
      field.appendChild(label);
      field.appendChild(input);
      modal.appendChild(field);
      return input;
    }

    var inputTitulo = campo('tarea.campo.titulo', 'text', rec && rec.titulo);
    var inputHora = campo('tarea.campo.hora', 'time', rec && rec.hora);
    var inputNota = campo('tarea.campo.nota', 'text', rec && rec.nota);

    var ayuda = document.createElement('p');
    ayuda.className = 'oc-modal-hint';
    ayuda.textContent = OC_I18N.t('tarea.ayuda');
    modal.appendChild(ayuda);

    function guardar() {
      var tituloTxt = inputTitulo.value.trim();
      if (!tituloTxt) {
        inputTitulo.classList.add('oc-input-error');
        inputTitulo.focus();
        return;
      }
      var datos = { titulo: tituloTxt, hora: inputHora.value || null, nota: inputNota.value.trim() };
      if (rec) {
        OCStore.actualizarRecordatorio(rec.id, datos);
      } else {
        datos.fecha = fechaISO;
        OCStore.crearRecordatorio(datos);
      }
      cerrarModalGenerico(overlay);
    }

    [inputTitulo, inputHora, inputNota].forEach(function (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          guardar();
        } else if (e.key === 'Escape') {
          cerrarModalGenerico(overlay);
        }
      });
    });
    inputTitulo.addEventListener('input', function () { inputTitulo.classList.remove('oc-input-error'); });

    var acciones = document.createElement('div');
    acciones.className = 'oc-modal-actions';
    var btnCancelar = document.createElement('button');
    btnCancelar.type = 'button';

    btnGuardar.type = 'button';
    btnGuardar.className = 'oc-btn oc-btn-primary';
    btnGuardar.textContent = OC_I18N.t('tarea.accion.guardar');

  /* ============================================================
     LISTA DE EVENTOS DEL DÍA — "Ver eventos del día" del menú del día
     o el chip "+N más". Elegir una fila abre el proyecto en Flujo
     (#/flujo/PRJ-XXXX), igual que "Abrir proyecto" en un chip.
     ============================================================ */
  var dayEventsModalEl = null;

  function closeDayEventsModal() {
    if (dayEventsModalEl && dayEventsModalEl.parentNode) {
      dayEventsModalEl.parentNode.removeChild(dayEventsModalEl);
    }
    dayEventsModalEl = null;
  }

  function openDayEventsModal(fechaISO, eventos) {
    closeDayEventsModal();

    var overlay = document.createElement('div');
    overlay.className = 'oc-modal-overlay';
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        closeDayEventsModal();
      }
    });

    var modal = document.createElement('div');
    modal.className = 'oc-modal oc-modal-lista';

    var titulo = document.createElement('h3');
    titulo.textContent = OC_I18N.t('calendar.listaDia.titulo') + ' — ' + fechaISO;
    modal.appendChild(titulo);

    var lista = document.createElement('div');
    lista.className = 'oc-lista-eventos';

    // Tras una acción (confirmar/iniciar/terminar/cancelar/marcar hecho)
    // se vuelve a abrir el modal con los datos frescos — más simple y
    // seguro que parchear la fila a mano, y consistente con el resto de
    // la app (todo re-renderiza completo, nunca parcial).
    function refrescar() {
      var frescos = OCStore.getEventosPorFecha(fechaISO).filter(function (e) { return e.estado !== 'cancelada'; });
      closeDayEventsModal();
      if (frescos.length > 0) {
        openDayEventsModal(fechaISO, frescos);
      }
    }

    eventos.forEach(function (evt) {
      var proyecto = OCStore.getProyecto(evt.proyectoId);
      var clase = OCStore.claseDeEvento(evt.tipo);
      var row = document.createElement('div');
      row.className = 'oc-lista-evento-row';

      var tipoChip = document.createElement('span');
      tipoChip.className = 'oc-evt-chip oc-evt-chip--' + (clase === 'hito' ? 'hito' : evt.estado);
      if (OCStore.eventoVencido(evt)) {
        tipoChip.classList.add('oc-evt-chip--vencida');
      }
      tipoChip.textContent = OC_I18N.t('evento.tipo.' + evt.tipo);
      row.appendChild(tipoChip);

      var info = document.createElement('span');
      info.className = 'oc-lista-evento-info';
      var hora = evt.horaInicio ? (evt.horaInicio + (evt.horaFin ? ('–' + evt.horaFin) : '')) : '';
      var diaInfo = OCStore.diaDeActividad(evt, fechaISO);
      var diaTxt = diaInfo ? (' · ' + OC_I18N.t('calendar.chip.dia') + ' ' + diaInfo.dia + '/' + diaInfo.total) : '';
      info.textContent = evt.proyectoId + ' · ' + (proyecto ? proyecto.nombre : '') + (hora ? ' · ' + hora : '') + diaTxt;
      info.style.cursor = 'pointer';
      info.addEventListener('click', function (e) {
        e.stopPropagation();
        closeDayEventsModal();
        abrirProyecto(evt.proyectoId);
      });
      row.appendChild(info);

      var acciones = accionesDisponiblesEvento(evt);
      if (acciones.length > 0) {
        var accionesWrap = document.createElement('span');
        accionesWrap.className = 'oc-lista-evento-acciones';
        acciones.forEach(function (accion) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'oc-evt-accion-btn' + (accion.estado === 'cancelada' ? ' oc-evt-accion-btn--cancelar' : '');
          btn.textContent = OC_I18N.t(accion.labelKey);
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            OCStore.actualizarEvento(evt.id, { estado: accion.estado });
            refrescar();
          });
          accionesWrap.appendChild(btn);
        });
        row.appendChild(accionesWrap);
      }

      lista.appendChild(row);
    });

    modal.appendChild(lista);

    var accionesModal = document.createElement('div');
    accionesModal.className = 'oc-modal-actions';
    var btnCerrar = document.createElement('button');
    btnCerrar.type = 'button';
    btnCerrar.className = 'oc-btn oc-btn-secondary';
    btnCerrar.textContent = OC_I18N.t('cotizacion.accion.cancelar');
    btnCerrar.addEventListener('click', closeDayEventsModal);
    accionesModal.appendChild(btnCerrar);
    modal.appendChild(accionesModal);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    dayEventsModalEl = overlay;
  }

  function cerrarModalGenerico(overlay) {
    if (overlay && overlay.parentNode) {
      overlay.parentNode.removeChild(overlay);
    }
  }

  /* ============================================================
     MODAL "NUEVO PROYECTO" — crea el proyecto (y, si viene de un día
     del calendario, un evento de seguimiento ese día) y pasa directo
     a la etapa 1 para capturar la solicitud.

    var titulo = document.createElement('h3');
    titulo.textContent = OC_I18N.t('proyecto.nuevo.titulo');
    modal.appendChild(titulo);

    function campo(labelKey, tipo) {
      var field = document.createElement('div');
      field.className = 'oc-field';
      var label = document.createElement('label');
      label.textContent = OC_I18N.t(labelKey);
      var input = document.createElement('input');
      input.type = tipo || 'text';
      input.className = 'oc-input';
      field.appendChild(label);
      field.appendChild(input);
      modal.appendChild(field);
      return input;
    }

    function campoSelect(labelKey, opciones) {
      var field = document.createElement('div');
      field.className = 'oc-field';
      var label = document.createElement('label');
      label.textContent = OC_I18N.t(labelKey);
      var select = document.createElement('select');
      select.className = 'oc-input';
      opciones.forEach(function (opt) {
        var option = document.createElement('option');
        option.value = opt.value;
        option.textContent = opt.label;
        select.appendChild(option);
      });
      field.appendChild(label);
      field.appendChild(select);
      modal.appendChild(field);
      return select;
    }

    var inputNombre = campo('proyecto.nuevo.campo.nombre');
    var inputCliente = campo('proyecto.nuevo.campo.clienteNombre');
    var inputTipo = campoSelect('proyecto.nuevo.campo.tipo', OCStore.TIPOS_PROYECTO.map(function (tp) {
      return { value: tp.id, label: tp.nombre[OC_I18N.getLang()] || tp.nombre.es };
    }));
    var inputUbicacion = campo('proyecto.nuevo.campo.ubicacion');
    // La fecha de alta siempre arranca en hoy, prellenada y editable; si
    // el modal se abrió desde un día del calendario (fechaISO), ese día
    // NO se usa aquí — solo sirve para el evento que se agenda abajo.
    var inputFechaAlta = campo('proyecto.nuevo.campo.fechaAlta', 'date');
    inputFechaAlta.value = OCStore.todayISO();

    var acciones = document.createElement('div');
    acciones.className = 'oc-modal-actions';

    var btnCancelar = document.createElement('button');
    btnCancelar.type = 'button';
    btnCancelar.className = 'oc-btn oc-btn-secondary';
    btnCancelar.textContent = OC_I18N.t('proyecto.nuevo.cancelar');
    btnCancelar.addEventListener('click', function () { cerrarModalGenerico(overlay); });
    acciones.appendChild(btnCancelar);

    var btnGuardar = document.createElement('button');
    btnGuardar.type = 'button';
    btnGuardar.className = 'oc-btn oc-btn-primary';
    btnGuardar.textContent = OC_I18N.t('proyecto.nuevo.guardar');
    btnGuardar.addEventListener('click', function () {
      var nombre = inputNombre.value.trim();
      if (!nombre) {
        inputNombre.classList.add('oc-input-error');
        return;
      }
      var proyecto = OCStore.crearProyecto({
        nombre: nombre,
        cliente: { nombre: inputCliente.value.trim() || nombre },
        tipo: inputTipo.value.trim(),
        ubicacion: inputUbicacion.value.trim(),
        estado: 'prospecto',
        fechaAlta: inputFechaAlta.value || OCStore.todayISO()
      });
      if (fechaISO) {
        OCStore.crearEvento({ proyectoId: proyecto.id, etapa: 'solicitud-cotizacion', tipo: 'seguimiento', fecha: fechaISO });
      }
      cerrarModalGenerico(overlay);
      var url = 'OC_SOLICITUD.html?proyecto=' + encodeURIComponent(proyecto.id);
      if (fechaISO) {
        url += '&fecha=' + encodeURIComponent(fechaISO);
      }
      if (opts && opts.desde) {
        url += '&desde=' + encodeURIComponent(opts.desde);
      }
      window.location.href = url;
    });
    acciones.appendChild(btnGuardar);

    modal.appendChild(acciones);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  /* ============================================================
     LEYENDA — botón "?" del encabezado del calendario. Popover con
     muestras reales (mismas clases que usa el calendario) para
     Reservado/Ocupado, estados de los chips, hitos, tareas y la
     alerta roja. Se cierra con Esc o clic afuera.
     ============================================================ */
  var leyendaEl = null;

  function closeLeyenda() {
    if (leyendaEl && leyendaEl.parentNode) {
      leyendaEl.parentNode.removeChild(leyendaEl);
    }
    leyendaEl = null;
    var btn = document.getElementById('oc-cal-leyenda-btn');
    if (btn) { btn.setAttribute('aria-expanded', 'false'); }
    document.removeEventListener('click', onDocumentClickForLeyenda, true);
    document.removeEventListener('keydown', onKeydownForLeyenda, true);
  }

  function onDocumentClickForLeyenda(e) {
    var btn = document.getElementById('oc-cal-leyenda-btn');
    if (leyendaEl && !leyendaEl.contains(e.target) && !(btn && btn.contains(e.target))) {
      closeLeyenda();
    }
  }

  function onKeydownForLeyenda(e) {
    if (e.key === 'Escape') {
      closeLeyenda();
    }
  }

  function leyendaFila(muestra, textoKey) {
    var fila = document.createElement('div');
    fila.className = 'oc-leyenda-fila';
    var celdaMuestra = document.createElement('span');
    celdaMuestra.className = 'oc-leyenda-muestra';
    celdaMuestra.appendChild(muestra);
    var texto = document.createElement('span');
    texto.className = 'oc-leyenda-texto';
    texto.textContent = OC_I18N.t(textoKey);
    fila.appendChild(celdaMuestra);
    fila.appendChild(texto);
    return fila;
  }

  function muestraChip(clases, texto) {
    var el = document.createElement('span');
    el.className = clases;
    el.textContent = texto;
    return el;
  }

  function leyendaSeccion(el, tituloKey) {
    var titulo = document.createElement('div');
    titulo.className = 'oc-dropdown-submenu-title';
    titulo.textContent = OC_I18N.t(tituloKey);
    el.appendChild(titulo);
  }

  function openLeyenda() {
    if (leyendaEl) {
      closeLeyenda();
      return;
    }
    closeDayMenu();
    closeEventoAccionesDropdown();

    var btn = document.getElementById('oc-cal-leyenda-btn');
    var el = document.createElement('div');
    el.className = 'oc-cotizacion-dropdown oc-leyenda';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', OC_I18N.t('leyenda.aria'));

    leyendaSeccion(el, 'leyenda.dia.titulo');
    el.appendChild(leyendaFila(muestraChip('oc-day-status oc-day-status--reservado', OC_I18N.t('dia.estado.reservado')), 'leyenda.dia.reservado'));
    el.appendChild(leyendaFila(muestraChip('oc-day-status oc-day-status--ocupado', OC_I18N.t('dia.estado.ocupado')), 'leyenda.dia.ocupado'));

    leyendaSeccion(el, 'leyenda.eventos.titulo');
    el.appendChild(leyendaFila(muestraChip('oc-evt-chip oc-evt-chip--tentativa', OC_I18N.t('evento.estado.tentativa')), 'leyenda.evento.tentativa'));
    el.appendChild(leyendaFila(muestraChip('oc-evt-chip oc-evt-chip--confirmada', OC_I18N.t('evento.estado.confirmada')), 'leyenda.evento.confirmada'));
    el.appendChild(leyendaFila(muestraChip('oc-evt-chip oc-evt-chip--en_ejecucion', OC_I18N.t('evento.estado.en_ejecucion')), 'leyenda.evento.enEjecucion'));
    el.appendChild(leyendaFila(muestraChip('oc-evt-chip oc-evt-chip--terminada', OC_I18N.t('evento.estado.terminada')), 'leyenda.evento.terminada'));
    el.appendChild(leyendaFila(muestraChip('oc-evt-chip oc-evt-chip--hito', OC_I18N.t('leyenda.hito.muestra')), 'leyenda.evento.hito'));
    el.appendChild(leyendaFila(muestraChip('oc-evt-chip oc-evt-chip--confirmada oc-evt-chip--vencida', OC_I18N.t('leyenda.vencida.muestra')), 'leyenda.evento.vencida'));

    leyendaSeccion(el, 'leyenda.tareas.titulo');
    el.appendChild(leyendaFila(muestraChip('oc-tarea-chip', OC_I18N.t('leyenda.tarea.muestra')), 'leyenda.tarea.pendiente'));
    el.appendChild(leyendaFila(muestraChip('oc-tarea-chip oc-tarea-chip--hecho', OC_I18N.t('leyenda.tarea.muestra')), 'leyenda.tarea.hecha'));

    document.body.appendChild(el);
    leyendaEl = el;
    if (btn) { btn.setAttribute('aria-expanded', 'true'); }

    var rect = btn.getBoundingClientRect();
    var elRect = el.getBoundingClientRect();
    var left = Math.max(12, Math.min(rect.right - elRect.width, window.innerWidth - elRect.width - 12));
    var top = Math.max(12, Math.min(rect.bottom + 6, window.innerHeight - elRect.height - 12));
    el.style.left = left + 'px';
    el.style.top = top + 'px';

    document.addEventListener('click', onDocumentClickForLeyenda, true);
    document.addEventListener('keydown', onKeydownForLeyenda, true);
  }

  function renderCalendar() {
    var titleEl = document.getElementById('oc-cal-title');
    var gridEl = document.getElementById('oc-cal-grid');

    // Las celdas se recrean abajo; ninguna referencia vieja debe quedar
    // sosteniendo un menú del día abierto.
    closeDayMenu();
    closeLeyenda();

    titleEl.textContent = OC_I18N.t('cal.months')[viewMonth] + ' ' + viewYear;
    gridEl.innerHTML = '';

    var firstOfMonth = new Date(viewYear, viewMonth, 1);
    var lastOfMonth = new Date(viewYear, viewMonth + 1, 0);
    var daysInMonth = lastOfMonth.getDate();

    // JS: getDay() -> 0=domingo..6=sábado. Queremos semana L-D (0=lunes..6=domingo).
    var firstWeekdayMonBased = (firstOfMonth.getDay() + 6) % 7;

    var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    var cells = [];

    // Días finales del mes anterior, para completar la primera semana
    for (var p = firstWeekdayMonBased; p > 0; p--) {
      cells.push({
        dayNum: daysInPrevMonth - p + 1,
        outside: true
      });
    }

    // Días del mes actual
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({
        dayNum: d,
        outside: false,
        dateObj: new Date(viewYear, viewMonth, d)
      });
    }

    // Días iniciales del mes siguiente, para completar la última semana
    var remainder = cells.length % 7;
    if (remainder !== 0) {
      var toAdd = 7 - remainder;
      for (var n = 1; n <= toAdd; n++) {
        cells.push({
          dayNum: n,
          outside: true
        });
      }
    }

    cells.forEach(function (cell) {
      var cellEl = document.createElement('div');
      cellEl.className = 'oc-day-cell';

      if (cell.outside) {
        cellEl.classList.add('oc-outside');
      } else {
        cellEl.classList.add('oc-current-month');
        if (isSameDay(cell.dateObj, today)) {
          cellEl.classList.add('oc-today');
        }
        cellEl.setAttribute('data-fecha', OCStore.dateToISO(cell.dateObj));

        cellEl.addEventListener('click', function (e) {
          if (e.button !== 0) {
            return; // solo click izquierdo; derecho/rueda no llegan aquí de todos modos
          }
          var fechaISO = OCStore.dateToISO(cell.dateObj);
          if (dayMenuFecha === fechaISO) {
            // Mismo día que ya tiene el menú abierto: toggle a cerrado.
            closeDayMenu();
            return;
          }
          openDayMenu(cellEl, fechaISO);
        });
      }

      var numEl = document.createElement('div');
      numEl.className = 'oc-day-number';
      numEl.textContent = cell.dayNum;
      cellEl.appendChild(numEl);

      // Etiqueta de estado del día (Reservado/Ocupado; "Libre" no se
      // pinta) + chips de evento. Solo en días del mes actual; los
      // eventos cancelados no ocupan la agenda, se excluyen de la vista.
      if (!cell.outside && window.OCStore) {
        var fechaISO = OCStore.dateToISO(cell.dateObj);
        var eventosDia = OCStore.getEventosPorFecha(fechaISO).filter(function (e) { return e.estado !== 'cancelada'; });
        var estadoDia = OCStore.getEstadoDia(fechaISO);

        if (estadoDia !== 'libre') {
          var statusPill = document.createElement('span');
          statusPill.className = 'oc-day-status oc-day-status--' + estadoDia;
          statusPill.textContent = OC_I18N.t('dia.estado.' + estadoDia);
          cellEl.appendChild(statusPill);
        }

        if (eventosDia.length > 0) {
          var chipsEl = document.createElement('div');
          chipsEl.className = 'oc-day-chips';

          eventosDia.slice(0, DAY_CHIPS_VISIBLE).forEach(function (evt) {
            chipsEl.appendChild(buildEventChip(evt, fechaISO));
          });

          if (eventosDia.length > DAY_CHIPS_VISIBLE) {
            var masChip = document.createElement('button');
            masChip.type = 'button';
            masChip.className = 'oc-evt-chip oc-evt-chip--mas';
            masChip.textContent = '+' + (eventosDia.length - DAY_CHIPS_VISIBLE) + ' ' + OC_I18N.t('calendar.chip.mas');
            masChip.addEventListener('click', function (e2) {
              e2.stopPropagation();
              openDayEventsModal(fechaISO, eventosDia);
            });
            chipsEl.appendChild(masChip);
          }

          cellEl.appendChild(chipsEl);
        }

        // Tareas (recordatorios): hasta 2 chips bajo los de evento + "+n tareas".
        // No cuentan en getEstadoDia ni ocupan el calendario.
        var tareasDia = OCStore.getRecordatoriosPorFecha(fechaISO);
        if (tareasDia.length > 0) {
          var tareasEl = document.createElement('div');
          tareasEl.className = 'oc-day-tareas';
          tareasDia.slice(0, DAY_TAREAS_VISIBLE).forEach(function (rec) {
            var tChip = document.createElement('button');
            tChip.type = 'button';
            tChip.className = 'oc-tarea-chip' + (rec.hecho ? ' oc-tarea-chip--hecho' : '');
            tChip.textContent = rec.titulo;
            tChip.title = rec.titulo;
            tareasEl.appendChild(tChip); // el clic burbujea a la celda y abre/cierra el menú del día
          });
          if (tareasDia.length > DAY_TAREAS_VISIBLE) {
            var tMas = document.createElement('button');
            tMas.type = 'button';
            tMas.className = 'oc-tarea-chip oc-tarea-chip--mas';
            tMas.textContent = '+' + (tareasDia.length - DAY_TAREAS_VISIBLE) + ' ' + OC_I18N.t('tarea.chip.mas');
            tareasEl.appendChild(tMas);
          }
          cellEl.appendChild(tareasEl);
        }
      }

      gridEl.appendChild(cellEl);
    });
  }

  function initCalendarNav() {
    document.getElementById('oc-cal-leyenda-btn').addEventListener('click', openLeyenda);

    document.getElementById('oc-cal-prev').addEventListener('click', function () {
      viewMonth -= 1;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear -= 1;
      }
      renderCalendar();
    });

    document.getElementById('oc-cal-next').addEventListener('click', function () {
      viewMonth += 1;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear += 1;
      }
      renderCalendar();
    });
  }

  /* ============================================================
     INIT
     ============================================================ */
  function renderAll() {
    aplicarRuta();
  }

  // Puente para flujo.js (script aparte): ventanas flotantes que viven aquí.
  window.OCUi = {
    openCotizacionDropdown: openCotizacionDropdown,
    openProyectoMenuDropdown: openProyectoMenuDropdown,
    mostrarSugerenciaPerdido: mostrarSugerenciaPerdido,
    openNuevoProyectoModal: openNuevoProyectoModal
  };

  initNavbar();
  initRouter();
  initCalendarNav();

  // Flujo y calendario dependen de los textos traducidos (nombres
  // de mes, etiquetas de etapa/estado), así que el primer render real
  // ocurre recién cuando el diccionario está listo (evento 'oc:langchange',
  // disparado por OC_I18N.init() más abajo) y luego en cada cambio de idioma.
  document.addEventListener('oc:langchange', renderAll);

  // store.js dispara esto en cada persist(): cubre cualquier mutación
  // hecha en esta misma pestaña (crear proyecto, agendar evento, emitir
  // cotización) sin tener que acordarse de llamar renderAll() a mano en
  // cada sitio que mute datos.
  document.addEventListener('oc:dataChange', renderAll);

  // 'storage' avisa de cambios hechos en OTRA pestaña (es su
  // comportamiento nativo: no dispara en la misma pestaña que escribió);
  // 'visibilitychange' cubre el caso más común aquí, que es volver de
  // OC_SOLICITUD.html/OC_COTIZACION.html a esta pestaña después de guardar.
  window.addEventListener('storage', function (e) {
    if (e.key === 'obracore.solicitudes') {
      renderAll();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      renderAll();
    }
  });

  OC_I18N.init();

  // Genera los PDFs de la semilla la primera vez (no bloquea el render;
  // solo importa que estén listos para cuando alguien de clic en "Ver
  // PDF"). Si algo falla (IndexedDB no disponible, etc.) queda en
  // consola, sin romper el resto de la app.
  if (window.OCPdf) {
    OCPdf.asegurarPdfsSemilla().catch(function (e) {
      console.error('[ObraCore] asegurarPdfsSemilla falló:', e);
    });
    OCPdf.asegurarLevantamientosSemilla().catch(function (e) {
      console.error('[ObraCore] asegurarLevantamientosSemilla falló:', e);
    });
  }
})();
</script>
